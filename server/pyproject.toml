[project]
name = "lutrinh-server"
version = "0.1.0"
description = "Lữ Trình route server: route packages, codes, publishing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.162.3",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "pillow>=11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyotp>=2.10.0",
    "sqlalchemy>=2.0.30",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
lutrinh = "lutrinh.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-defusedxml>=0.7.0.20260504",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lutrinh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lutrinh"]
