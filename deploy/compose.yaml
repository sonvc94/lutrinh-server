# Lữ Trình route server (design page 06 §5, D-18 A). Settings: deploy/.env (from .env.example).
#   docker compose -f deploy/compose.yaml up -d --build
# Profiles: `tunnel` (cloudflared, mode 3), `backup` (restic, used by deploy/backup.sh).
name: lutrinh

x-app: &app
  image: lutrinh-app:${LUTRINH_TAG:-latest}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: app
  environment:
    LUTRINH_MEDIA_ACCEL: "1"
    # Only Caddy can reach :8000 (not published), so its X-Forwarded-For is believed.
    FORWARDED_ALLOW_IPS: "*"
    TZ: Asia/Ho_Chi_Minh
  env_file:
    # Optional server settings (LUTRINH_MAINTENANCE, LUTRINH_MIN_APP_ANDROID, …).
    - path: ./app.env
      required: false
  volumes:
    - ${LUTRINH_DATA_PATH:-/var/lib/lutrinh}:/var/lib/lutrinh
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  app:
    <<: *app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/meta', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    # Same image as `app` (built once, by that service)
    build: !reset null
    pull_policy: never
    # and data; low CPU priority so video encoding never slows the API (page 06 §3).
    command: ["nice", "-n", "10", "lutrinh", "worker"]
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: lutrinh-caddy:${LUTRINH_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: caddy
    environment:
      LUTRINH_SITE: ${LUTRINH_SITE:-:80}
      LUTRINH_TRUSTED_PROXIES: ${LUTRINH_TRUSTED_PROXIES:-127.0.0.1/32}
      LUTRINH_CLIENT_IP_HEADERS: ${LUTRINH_CLIENT_IP_HEADERS:-X-Forwarded-For}
    ports:
      - ${LUTRINH_BIND:-0.0.0.0}:${LUTRINH_HTTP_PORT:-80}:80
      - ${LUTRINH_BIND:-0.0.0.0}:${LUTRINH_HTTPS_PORT:-443}:443
      - ${LUTRINH_BIND:-0.0.0.0}:${LUTRINH_HTTPS_PORT:-443}:443/udp
    volumes:
      - ${LUTRINH_DATA_PATH:-/var/lib/lutrinh}/media:/var/lib/lutrinh/media:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *logging

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    restart: unless-stopped
    logging: *logging

  restic:
    profiles: [backup]
    image: restic/restic:${RESTIC_TAG:-0.18.0}
    # A fixed host name keeps `restic forget` grouping snapshots across runs.
    hostname: lutrinh
    # The data owner: reads everything, and restored files come back owned by the app.
    user: "10001:10001"
    environment:
      RESTIC_CACHE_DIR: /tmp/restic-cache
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      B2_ACCOUNT_ID: ${B2_ACCOUNT_ID:-}
      B2_ACCOUNT_KEY: ${B2_ACCOUNT_KEY:-}
    volumes:
      # Read-write for `backup.sh --restore`; restic runs as the data owner either way.
      - ${LUTRINH_DATA_PATH:-/var/lib/lutrinh}:/data
      # A repository on another disk of this host (RESTIC_REPOSITORY=/repo-local).
      - ${RESTIC_LOCAL_DIR:-./restic-local}:/repo-local
    tmpfs:
      - /tmp
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
